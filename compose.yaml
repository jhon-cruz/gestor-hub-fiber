name: ${COMPOSE_PROJECT_NAME:-gestor-hub-fiber}

x-api-environment: &api-environment
  APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gestor_hub}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}@db:5432/${POSTGRES_DB:-gestor_hub_fiber}
  APP_JWT_SECRET: ${APP_JWT_SECRET:?defina APP_JWT_SECRET no arquivo .env}
  APP_ACCESS_TOKEN_MINUTES: ${APP_ACCESS_TOKEN_MINUTES:-30}
  APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-["http://localhost:3030"]}
  APP_MAP_PROVIDER: ${APP_MAP_PROVIDER:-openstreetmap}
  APP_GOOGLE_MAPS_BROWSER_API_KEY: ${APP_GOOGLE_MAPS_BROWSER_API_KEY:-}
  APP_GEOCODING_ENABLED: ${APP_GEOCODING_ENABLED:-true}
  APP_GEOCODING_PROVIDER: ${APP_GEOCODING_PROVIDER:-nominatim}
  APP_GEOCODING_BASE_URL: ${APP_GEOCODING_BASE_URL:-https://nominatim.openstreetmap.org}
  APP_GEOCODING_API_KEY: ${APP_GEOCODING_API_KEY:-}
  APP_GOOGLE_GEOCODING_BASE_URL: ${APP_GOOGLE_GEOCODING_BASE_URL:-https://maps.googleapis.com/maps/api/geocode}
  APP_VIACEP_ENABLED: ${APP_VIACEP_ENABLED:-true}
  APP_GEOCODING_CACHE_DAYS: ${APP_GEOCODING_CACHE_DAYS:-30}

x-api-base: &api-base
  build:
    context: ./services/api
  platform: linux/amd64
  environment: *api-environment
  depends_on:
    db:
      condition: service_healthy
  networks:
    - backend

services:
  db:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestor_hub_fiber}
      POSTGRES_USER: ${POSTGRES_USER:-gestor_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestor_hub} -d ${POSTGRES_DB:-gestor_hub_fiber}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  migration:
    <<: *api-base
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *api-base
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-3030}:8000"
    volumes:
      - ./services/api/app:/workspace/app
      - ./services/api/tests:/workspace/tests
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  test:
    <<: *api-base
    profiles: ["test"]
    command:
      - sh
      - -c
      - python scripts/prepare_test_database.py && alembic upgrade head && ruff format --check app tests alembic scripts && ruff check app tests alembic scripts && python -m pytest -q
    environment:
      <<: *api-environment
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gestor_hub}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}@db:5432/${POSTGRES_DB:-gestor_hub_fiber}_test
      TEST_ADMIN_DATABASE_URL: postgresql://${POSTGRES_USER:-gestor_hub}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}@db:5432/postgres
      POSTGRES_TEST_DATABASE: ${POSTGRES_DB:-gestor_hub_fiber}_test
      PYTHONPATH: /workspace
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    volumes:
      - ./services/api/app:/workspace/app:ro
      - ./services/api/tests:/workspace/tests:ro
      - ./services/api/scripts:/workspace/scripts:ro

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
